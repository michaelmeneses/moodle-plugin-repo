name: Build Satis

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build and Deploy Satis
    runs-on: ubuntu-latest

    container:
      image: middagtec/image-bitbucket-ci:v5-php84
      options: --user root

    env:
      COMPOSER_ALLOW_SUPERUSER: 1
      PROCESS_TIMEOUT: 21600
      COMPOSER_PROCESS_TIMEOUT: 21600
      COMPOSER_MEMORY_LIMIT: -1

      # Envs for Satis MIDDAG
      SATIS_NAME: ${{ vars.SATIS_NAME }}
      SATIS_URL: ${{ vars.SATIS_URL }}

      # Envs for S3 Satis (Cloudflare R2)
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_USE_PATH_STYLE_ENDPOINT: ${{ vars.S3_USE_PATH_STYLE_ENDPOINT }}
      S3_SATIS_CACHE_DIR: ${{ vars.S3_SATIS_CACHE_DIR }}
      S3_SATIS_CACHE_CHECKSUMS: ${{ vars.S3_SATIS_CACHE_CHECKSUMS }}
      S3C_USE_RCLONE: ${{ vars.S3C_USE_RCLONE }}

    steps:
      - name: Checkout source-code
        uses: actions/checkout@v7

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Restore temp checksums cache
        id: restore-temp-checksums
        uses: actions/cache/restore@v6
        with:
          path: ${{ vars.S3_SATIS_CACHE_CHECKSUMS }}
          key: checksums-temp-${{ runner.os }}
          restore-keys: |
            checksums-temp-${{ runner.os }}-

      - name: Ensure rclone is installed
        run: |
          set -e
          command -v rclone >/dev/null 2>&1 || curl -fsSL https://rclone.org/install.sh | bash

      - name: Restore S3-Satis cache from R2
        shell: bash
        run: |
          set -e
          mkdir -p "$S3_SATIS_CACHE_DIR"
          fps="${S3_USE_PATH_STYLE_ENDPOINT,,}"
          echo ">> Fetching s3-satis cache archive from R2 (_cache/s3-satis-cache.tar.gz)"
          rm -f /tmp/s3-satis-cache.tar.gz
          RCLONE_S3_PROVIDER="Other" \
          RCLONE_S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
          RCLONE_S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
          RCLONE_S3_REGION="$S3_REGION" \
          RCLONE_S3_ENDPOINT="$S3_ENDPOINT" \
          RCLONE_S3_FORCE_PATH_STYLE="$fps" \
          rclone copyto ":s3:$S3_BUCKET/_cache/s3-satis-cache.tar.gz" /tmp/s3-satis-cache.tar.gz || true
          # rclone copyto exits 0 ("nothing to transfer") even when the source
          # is missing -- it does NOT create the destination file, so checking
          # for the file's existence (not the exit code) is the only reliable
          # way to tell a real download apart from a no-op.
          if [ -s /tmp/s3-satis-cache.tar.gz ]; then
            echo ">> Extracting cache archive into $S3_SATIS_CACHE_DIR"
            tar xzf /tmp/s3-satis-cache.tar.gz -C "$S3_SATIS_CACHE_DIR"
          else
            echo ">> No cache archive found in R2 yet (first run) -- proceeding with a cold build"
          fi

      - name: Fix checksums before build
        run: |
          set -e
          export S3C_ROOTDIR=$S3_SATIS_CACHE_CHECKSUMS
          export S3C_DEBUG=0
          echo ">> Running s3-checksums.sh to verify and fix any missing checksums"
          chmod +x scripts/s3-checksums.sh
          composer run checksums:s3

      - name: Sync local checksums caches
        run: |
          set -e
          echo ">> Syncing local .checksums caches with rsync between $S3_SATIS_CACHE_CHECKSUMS and $S3_SATIS_CACHE_DIR (prefer $S3_SATIS_CACHE_CHECKSUMS/checksums)"
          # Ensure both directories exist
          mkdir -p $S3_SATIS_CACHE_CHECKSUMS/checksums
          mkdir -p $S3_SATIS_CACHE_DIR/.checksums
          # 1) Push from preferred → secondary: overwrite differing files, do NOT delete extras on destination
          rsync -a $S3_SATIS_CACHE_CHECKSUMS/checksums/ $S3_SATIS_CACHE_DIR/.checksums/
          # 2) Backfill from secondary → preferred: only copy files that don't exist on destination (no overwrite)
          rsync -a --ignore-existing $S3_SATIS_CACHE_DIR/.checksums/ $S3_SATIS_CACHE_CHECKSUMS/checksums/
          echo ">> Done syncing local .checksums caches with rsync"

      - name: Build s3-satis
        run: |
          set -e
          # composer/satis (dev-main) inspects VCS package sources via `git`
          # subprocesses that inherit this step's cwd -- the moodle-plugin-repo
          # checkout itself. A newer git (as shipped by the php84 image) then
          # refuses to run from a repo whose owning UID doesn't match the
          # invoking process, aborting the whole `build` command. This is a
          # throwaway CI container, so trust every directory.
          git config --global --add safe.directory '*'
          echo "Running composer run full:s3-satis"
          composer run full:s3-satis

      - name: Archive S3-Satis cache to R2
        if: success()
        shell: bash
        run: |
          set -e
          fps="${S3_USE_PATH_STYLE_ENDPOINT,,}"
          echo ">> Archiving $S3_SATIS_CACHE_DIR to R2 (_cache/s3-satis-cache.tar.gz)"
          tar czf /tmp/s3-satis-cache.tar.gz -C "$S3_SATIS_CACHE_DIR" .
          RCLONE_S3_PROVIDER="Other" \
          RCLONE_S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
          RCLONE_S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
          RCLONE_S3_REGION="$S3_REGION" \
          RCLONE_S3_ENDPOINT="$S3_ENDPOINT" \
          RCLONE_S3_FORCE_PATH_STYLE="$fps" \
          rclone copyto /tmp/s3-satis-cache.tar.gz ":s3:$S3_BUCKET/_cache/s3-satis-cache.tar.gz" --s3-no-check-bucket

      - name: Save temp checksums cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ vars.S3_SATIS_CACHE_CHECKSUMS }}
          key: checksums-temp-${{ runner.os }}

      - name: Show cache state summary
        run: |
          echo "Cache states:"
          du -sh /root/.cache/composer || true
          du -sh $S3_SATIS_CACHE_DIR || true
          du -sh $S3_SATIS_CACHE_CHECKSUMS || true

  modify_html:
    name: Modify index.html with custom CSS
    needs: build
    uses: ./.github/workflows/modify-html.yml
    secrets: inherit
